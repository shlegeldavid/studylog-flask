<article class="post-card">
    <div class="post-meta">
        <a href="{{ url_for('main.user', username=post.author.username) }}">@{{ post.author.username }}</a>
        <span>{{ post.created_at.strftime("%d.%m.%Y %H:%M") }}</span>
    </div>
    <p class="post-body">{{ post.body }}</p>
</article>
