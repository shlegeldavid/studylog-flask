{% if pagination.pages > 1 %}
    <nav class="pagination" aria-label="Пагинация">
        {% if prev_url %}
            <a class="button button-secondary" href="{{ prev_url }}">Назад</a>
        {% else %}
            <span></span>
        {% endif %}

        <span class="pagination-info">Страница {{ pagination.page }} из {{ pagination.pages }}</span>

        {% if next_url %}
            <a class="button button-secondary" href="{{ next_url }}">Вперед</a>
        {% else %}
            <span></span>
        {% endif %}
    </nav>
{% endif %}
